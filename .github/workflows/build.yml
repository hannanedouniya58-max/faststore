name: build
on: [push, workflow_dispatch]
jobs:
  pkg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faststore-pkg
          path: |
            out/*.pkg
            eboot.bin
